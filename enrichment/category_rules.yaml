# Category rules (step 4.7). Ordered: the first rule that matches wins.
#
#   p31  : classes the item is an instance of (P31). Also checked one level up: if the
#          item's class is a subclass (P279) of a listed class, that counts too, so
#          "2024 Indian general election" (instance of "general election", which is a
#          subclass of "election") still lands in Politics.
#   p106 : occupations (P106), used for people.
#
# Every QID carries the English label it is supposed to have. Before relying on the
# rules, check them against Wikidata:
#   docker compose exec edge python3 enrichment/verify_rules.py
default: Other

rules:
  - category: Disasters
    p31:
      Q8065: natural disaster
      Q3839081: disaster
      Q7944: earthquake
      Q8068: flood
      Q8092: tropical cyclone
      Q168983: conflagration
